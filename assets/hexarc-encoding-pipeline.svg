<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background:#0f172a; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <style>
      .title { fill: #38bdf8; font-size: 20px; font-weight: bold; text-anchor: middle; }
      .box-title { fill: #f8fafc; font-size: 14px; font-weight: bold; }
      .box-desc { fill: #94a3b8; font-size: 11px; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrowhead); }
      .highlight { fill: #38bdf8; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <text x="400" y="35" class="title">HexArc Code - Bit Stream &amp; Encoding Pipeline / Tok Podatkov</text>

  <!-- Step 1: Input -->
  <g transform="translate(40, 70)">
    <rect width="200" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="15" y="30" class="box-title">1. Vhodni podatki (Input)</text>
    <text x="15" y="55" class="box-desc">• Besedilo (Text UTF-8) ali</text>
    <text x="15" y="72" class="box-desc">• Numerični niz (0-9)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="240" y1="120" x2="280" y2="120" class="arrow"/>

  <!-- Step 2: Mode Detection & Bits -->
  <g transform="translate(290, 70)">
    <rect width="220" height="100" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="28" class="box-title">2. Način in Zgoščevanje</text>
    <text x="15" y="50" class="box-desc"><tspan class="highlight">Numeric Mode</tspan>: Header <tspan fill="#f59e0b">001</tspan> (3 bit)</text>
    <text x="15" y="67" class="box-desc"><tspan class="highlight">Text Mode</tspan>: Header <tspan fill="#f59e0b">010</tspan> (3 bit)</text>
    <text x="15" y="85" class="box-desc">+ Dolžina (12 bit) + Biti podatkov</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="510" y1="120" x2="550" y2="120" class="arrow"/>

  <!-- Step 3: Reed-Solomon ECC -->
  <g transform="translate(560, 70)">
    <rect width="200" height="100" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="15" y="30" class="box-title" fill="#f43f5e">3. Popravljanje napak</text>
    <text x="15" y="52" class="box-desc">• GF(256) Polinom 0x11d</text>
    <text x="15" y="70" class="box-desc">• <tspan fill="#f43f5e" font-weight="bold">16 ECC simbolov</tspan> (pariteta)</text>
    <text x="15" y="87" class="box-desc">• Reed-Solomon (N + 16 B)</text>
  </g>

  <!-- Down Arrow from 3 to 4 -->
  <path d="M 660,170 L 660,210 L 400,210 L 400,240" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Sector Geometry Mapping -->
  <g transform="translate(100, 250)">
    <rect width="600" height="180" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="35" class="box-title" fill="#f59e0b">4. Preslikava Bitnega Niza v Obroče in Sektorje (Arc Geometry)</text>

    <!-- Sub-boxes or details -->
    <rect x="20" y="55" width="170" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="78" fill="#38bdf8" font-size="12" font-weight="bold">Radij obroča (R)</text>
    <text x="30" y="98" class="box-desc">Začne se pri R_START = 64px</text>
    <text x="30" y="115" class="box-desc">Korak ΔR = 14px</text>
    <text x="30" y="132" class="box-desc">R_max = 200px</text>

    <rect x="210" y="55" width="180" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="220" y="78" fill="#38bdf8" font-size="12" font-weight="bold">Varnostni odmik (Keepout)</text>
    <text x="220" y="98" class="box-desc">Fiksna širina = 14px</text>
    <text x="220" y="115" class="box-desc">Kot θ_keepout = 14 / R</text>
    <text x="220" y="132" class="box-desc">3 sektorji med osmi</text>

    <rect x="410" y="55" width="170" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="420" y="78" fill="#38bdf8" font-size="12" font-weight="bold">Kapaciteta Sektorja</text>
    <text x="420" y="98" class="box-desc">Bits/sector =</text>
    <text x="420" y="115" class="box-desc" fill="#f59e0b">floor((θ_usable * R) / 10)</text>
    <text x="420" y="132" class="box-desc">1 bit = lok širine 8px + 2px gap</text>
  </g>

</svg>
