<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexArc Code Generator & Scanner Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center">

    <header class="text-center max-w-2xl mb-6">
        <h1 class="text-3xl md:text-4xl font-bold text-blue-400 mb-2">HexArc Code</h1>
    </header>

    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Controls Panel -->
        <section class="lg:col-span-5 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-semibold mb-4 text-white border-b border-slate-700 pb-2">Nastavitve Kode</h2>
                
                <div class="mb-4">
                    <label for="textInput" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Vsebina (Besedilo ali URL)
                    </label>
                    <input type="text" id="textInput" value="https://hexarc.io/code/9876" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>

                <div class="mb-4">
                    <button onclick="generateHexArc()" 
                            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:shadow-blue-500/20 transition duration-200">
                        Generiraj Kodo
                    </button>
                </div>

                <div id="genMsg" class="text-sm font-medium mb-3"></div>
            </div>

            <div>
                <button onclick="downloadCode()" 
                        class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-3 px-4 rounded-xl border border-slate-600 transition">
                    Prenesi PNG Sliko
                </button>
            </div>
        </section>

        <!-- Canvas Visualizer Panel -->
        <section class="lg:col-span-7 bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl flex flex-col items-center justify-center relative min-h-[480px]">
            <div class="bg-white p-4 rounded-2xl shadow-inner max-w-full flex items-center justify-center">
                <canvas id="hexCanvas" width="560" height="560" class="max-w-full h-auto rounded-lg"></canvas>
            </div>
        </section>

    </main>

    <script>
        // ECC GF(256) Constants and Reed-Solomon Code
        const ECC_SYMBOLS = 16;
        const GF_EXP = new Uint8Array(512);
        const GF_LOG = new Uint8Array(256);

        (function initGF() {
            let x = 1;
            for (let i = 0; i < 255; i++) {
                GF_EXP[i] = x;
                GF_LOG[x] = i;
                x <<= 1;
                if (x & 0x100) x ^= 0x11d;
            }
            for (let i = 255; i < 512; i++) {
                GF_EXP[i] = GF_EXP[i - 255];
            }
        })();

        function gfMul(x, y) {
            if (x === 0 || y === 0) return 0;
            return GF_EXP[GF_LOG[x] + GF_LOG[y]];
        }

        function rsGeneratorPoly(nsym) {
            let g = [1];
            for (let i = 0; i < nsym; i++) {
                let nextG = new Array(g.length + 1).fill(0);
                for (let j = 0; j < g.length; j++) {
                    nextG[j] ^= gfMul(g[j], GF_EXP[i]);
                    nextG[j + 1] ^= g[j];
                }
                g = nextG;
            }
            return g;
        }

        function rsEncode(msg, nsym) {
            const gen = rsGeneratorPoly(nsym);
            const res = new Uint8Array(msg.length + nsym);
            res.set(msg);

            for (let i = 0; i < msg.length; i++) {
                const coef = res[i];
                if (coef !== 0) {
                    for (let j = 0; j < gen.length; j++) {
                        res[i + j] ^= gfMul(gen[j], coef);
                    }
                }
            }
            res.set(msg);
            return res;
        }

        function pushBits(arr, val, count) {
            for (let i = count - 1; i >= 0; i--) {
                arr.push((val >> i) & 1);
            }
        }

        function compressAndEncode(text) {
            let mode = "6bit";
            if (/^\d+$/.test(text)) {
                mode = "numeric";
            }

            let bits = [];
            if (mode === "numeric") {
                pushBits(bits, 1, 3);
                pushBits(bits, text.length, 12);
                for (let i = 0; i < text.length; i++) {
                    pushBits(bits, parseInt(text[i]), 4);
                }
            } else {
                const encoder = new TextEncoder();
                const bytes = Array.from(encoder.encode(text));
                pushBits(bits, 2, 3);
                pushBits(bits, bytes.length, 12);
                bytes.forEach(b => pushBits(bits, b, 8));
            }

            let dataBytes = [];
            for (let i = 0; i < bits.length; i += 8) {
                let byte = 0;
                for (let b = 0; b < 8; b++) {
                    if (i + b < bits.length) {
                        byte = (byte << 1) | bits[i + b];
                    } else {
                        byte = (byte << 1);
                    }
                }
                dataBytes.push(byte);
            }

            return { bytes: dataBytes, mode: mode };
        }

        const CANVAS_SIZE = 560; // Expanded to ensure 40px Quiet Zone border
        const CENTER = CANVAS_SIZE / 2;
        const HEX_RADIUS = 38;
        const RING_START = 64;
        const RING_GAP = 14;
        const LINE_THICKNESS = 8;
        const CUBE_LINE_THICKNESS = 5;
        const MAX_RADIUS = 200;
        const KEEPOUT_MARGIN_PX = 14; 
        
        // Axis 0 = Top (-90° / -PI/2), Axis 1 = Bottom Right (+30° / PI/6), Axis 2 = Bottom Left (+150° / 5PI/6)
        const AXIS_ANGLES = [-Math.PI / 2, Math.PI / 6, (5 * Math.PI) / 6];

        function showMessage(elementId, text, isError = false) {
            const el = document.getElementById(elementId);
            el.innerText = text;
            el.className = isError ? "text-red-400 font-semibold" : "text-emerald-400 font-semibold";
        }

        function generateHexArc() {
            let text = document.getElementById('textInput').value.trim();
            const canvas = document.getElementById('hexCanvas');
            const ctx = canvas.getContext('2d');

            if (!text) {
                text = "HexArc";
            }

            const encoded = compressAndEncode(text);
            const dataBytes = new Uint8Array(encoded.bytes);
            const fullBytes = rsEncode(dataBytes, ECC_SYMBOLS);

            let bitArray = [];
            fullBytes.forEach(byte => {
                for (let i = 7; i >= 0; i--) bitArray.push((byte >> i) & 1);
            });

            let bitIndex = 0;
            let usedRings = 0;
            let simBitIndex = 0;
            let calcRadius = RING_START;

            while (simBitIndex < bitArray.length && calcRadius <= MAX_RADIUS) {
                const keepoutAngle = KEEPOUT_MARGIN_PX / calcRadius;
                const usableSectorAngle = ((2 * Math.PI) / 3) - (2 * keepoutAngle);
                const bitsPerSector = Math.floor((usableSectorAngle * calcRadius) / (LINE_THICKNESS + 2));
                
                if (bitsPerSector > 0) {
                    simBitIndex += (bitsPerSector * 3);
                }
                usedRings++;
                if (simBitIndex >= bitArray.length) break;
                calcRadius += RING_GAP;
            }

            if (simBitIndex < bitArray.length) {
                showMessage('genMsg', "Koda je polna! Besedilo je predolgo.", true);
            } else {
                showMessage('genMsg', "Koda uspešno ustvarjena!", false);
            }

            // Clear Canvas (Pure white background for Quiet Zone)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            const lastDataRadius = RING_START + (usedRings - 1) * RING_GAP;
            const BOUNDARY_RING_RADIUS = lastDataRadius + RING_GAP;
            const AXIS_END_RADIUS = BOUNDARY_RING_RADIUS + 30; 

            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = CUBE_LINE_THICKNESS;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            // 1. Sredinski šestkotnik
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                const x = CENTER + HEX_RADIUS * Math.cos(angle);
                const y = CENTER + HEX_RADIUS * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();

            // 2. Pobarvan zgornji romb v kocki
            ctx.beginPath();
            ctx.moveTo(CENTER, CENTER);
            const p1Angle = -Math.PI / 2;
            const p2Angle = -Math.PI / 6;
            const p3Angle = -5 * Math.PI / 6;
            
            ctx.lineTo(CENTER + HEX_RADIUS * Math.cos(p3Angle), CENTER + HEX_RADIUS * Math.sin(p3Angle));
            ctx.lineTo(CENTER + HEX_RADIUS * Math.cos(p1Angle), CENTER + HEX_RADIUS * Math.sin(p1Angle));
            ctx.lineTo(CENTER + HEX_RADIUS * Math.cos(p2Angle), CENTER + HEX_RADIUS * Math.sin(p2Angle));
            ctx.closePath();
            ctx.fill();

            // Store outer landmark positions for CV simulator overlay
            const markerPositions = [];

            // 3. Glavne osi in novi asimetrični markerji
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                const hexX = CENTER + HEX_RADIUS * Math.cos(angle);
                const hexY = CENTER + HEX_RADIUS * Math.sin(angle);

                if (i % 2 === 0) {
                    // Os poteka do AXIS_END_RADIUS
                    const endX = CENTER + AXIS_END_RADIUS * Math.cos(angle);
                    const endY = CENTER + AXIS_END_RADIUS * Math.sin(angle);
                    
                    ctx.beginPath();
                    ctx.moveTo(hexX, hexY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();

                    // --- MARKERJI NA TRIS OSEH ---
                    const axisIndex = i / 2; // 0: Zgoraj (-90°), 1: Spodaj desno (+30°), 2: Spodaj levo (+150°)
                    markerPositions.push({ x: endX, y: endY, angle: angle, type: axisIndex === 0 ? 'arrow' : 'circle' });

                    if (axisIndex === 0) {
                        // --- ZGORNJI MARKER: VEČJA OSTRO USMERJENA PUŠČICA / TRIKOTNIK ---
                        const arrowLength = 22;
                        const arrowWidth = 18;
                        
                        const tipX = endX + arrowLength * Math.cos(angle);
                        const tipY = endY + arrowLength * Math.sin(angle);

                        const perp = angle + Math.PI / 2;
                        const leftX = endX + (arrowWidth / 2) * Math.cos(perp);
                        const leftY = endY + (arrowWidth / 2) * Math.sin(perp);
                        const rightX = endX - (arrowWidth / 2) * Math.cos(perp);
                        const rightY = endY - (arrowWidth / 2) * Math.sin(perp);

                        ctx.beginPath();
                        ctx.moveTo(tipX, tipY);
                        ctx.lineTo(leftX, leftY);
                        ctx.lineTo(rightX, rightY);
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        // --- SPODNJA MARKERJA: POLNA KROGA ---
                        const circleRadius = 10;
                        const circleCenterX = endX + circleRadius * Math.cos(angle);
                        const circleCenterY = endY + circleRadius * Math.sin(angle);

                        ctx.beginPath();
                        ctx.arc(circleCenterX, circleCenterY, circleRadius, 0, 2 * Math.PI);
                        ctx.fill();
                    }

                } else {
                    // Notranje osi do središča
                    ctx.beginPath();
                    ctx.moveTo(hexX, hexY);
                    ctx.lineTo(CENTER, CENTER);
                    ctx.stroke();
                }
            }

            // 4. ČASOVNE OZNAKE (Timing Tracks) NA VSEH 3 OSEH
            const tickLength = 5.5;
            ctx.lineWidth = 2.5;

            for (let r = RING_START; r <= lastDataRadius; r += RING_GAP) {
                AXIS_ANGLES.forEach(axisAngle => {
                    const tickCenterX = CENTER + r * Math.cos(axisAngle);
                    const tickCenterY = CENTER + r * Math.sin(axisAngle);
                    const perpAngle = axisAngle + Math.PI / 2;

                    ctx.beginPath();
                    ctx.moveTo(
                        tickCenterX + tickLength * Math.cos(perpAngle),
                        tickCenterY + tickLength * Math.sin(perpAngle)
                    );
                    ctx.lineTo(
                        tickCenterX - tickLength * Math.cos(perpAngle),
                        tickCenterY - tickLength * Math.sin(perpAngle)
                    );
                    ctx.stroke();
                });
            }

            // 5. ZUNANJA OBROBA (Boundary Ring za izračun perspektivne elipse)
            ctx.beginPath();
            ctx.lineWidth = LINE_THICKNESS;
            ctx.arc(CENTER, CENTER, BOUNDARY_RING_RADIUS, 0, 2 * Math.PI);
            ctx.stroke();

            // 6. PODATKOVNI OBROČI (Arcs)
            bitIndex = 0;
            let currentRadius = RING_START;
            ctx.lineWidth = LINE_THICKNESS;
            ctx.lineCap = "butt";

            while (bitIndex < bitArray.length && currentRadius <= lastDataRadius) {
                const keepoutAngle = KEEPOUT_MARGIN_PX / currentRadius;
                const usableSectorAngle = ((2 * Math.PI) / 3) - (2 * keepoutAngle);
                const bitsPerSector = Math.floor((usableSectorAngle * currentRadius) / (LINE_THICKNESS + 2));
                const anglePerBit = usableSectorAngle / bitsPerSector;

                if (bitsPerSector > 0) {
                    for (let s = 0; s < 3; s++) {
                        const startSectorAngle = AXIS_ANGLES[s] + keepoutAngle;
                        
                        for (let b = 0; b < bitsPerSector; b++) {
                            if (bitIndex >= bitArray.length) break;

                            if (bitArray[bitIndex] === 1) {
                                const bitStart = startSectorAngle + (b * anglePerBit);
                                const bitEnd = bitStart + anglePerBit;
                                
                                ctx.beginPath();
                                ctx.arc(CENTER, CENTER, currentRadius, bitStart, bitEnd + 0.015);
                                ctx.stroke();
                            }
                            bitIndex++;
                        }
                    }
                }
                currentRadius += RING_GAP;
            }
        }

        function downloadCode() {
            const canvas = document.getElementById('hexCanvas');
            const link = document.createElement('a');
            link.download = 'HexArc_Code.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = generateHexArc;
    </script>
</body>
</html>
